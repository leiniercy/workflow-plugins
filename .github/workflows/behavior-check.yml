name: Contratos de comportamiento

# Mitad determinista del eval, en dos capas:
#   check-behavior.mjs — contratos de los prompts (read-only de /review, tools/modelo de
#     los agentes, auto-activación de guías, banderas rojas, dato no fiable).
#   check-routing.mjs  — enrutado del catálogo: colisión entre descriptions, fronteras
#     entre guías confundibles y tasa de top-3 sobre su suelo.
#   check-graders.mjs  — que el grader de cada caso distinga acierto de fallo, contra las
#     respuestas de ejemplo de su `graders/muestras.json`. Es la parte más barata de
#     equivocarse y era la única que nadie probaba: un grader roto no falla, canta un ✓.
# La mitad que necesita un modelo vive en check-activation.mjs (gasta cuota, a mano) y en
# docs/eval-comportamiento.md.

on:
  push:
    branches: ["**"]
    paths:
      - "core/**"
      - "scripts/sync.mjs"
      - "scripts/check-behavior.mjs"
      - "scripts/check-routing.mjs"
      - "scripts/check-graders.mjs"
      - "scripts/lib/grader.mjs"
      - "adapters/**"
      - ".github/workflows/behavior-check.yml"
  pull_request:
    paths:
      - "core/**"
      - "scripts/sync.mjs"
      - "scripts/check-behavior.mjs"
      - "scripts/check-routing.mjs"
      - "scripts/check-graders.mjs"
      - "scripts/lib/grader.mjs"
      - "adapters/**"
      - ".github/workflows/behavior-check.yml"

permissions:
  contents: read

jobs:
  behavior-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Asevera los contratos de comportamiento
        run: node scripts/check-behavior.mjs

      - name: Asevera el enrutado del catálogo de guías
        run: node scripts/check-routing.mjs

      - name: Asevera que los graders distinguen acierto de fallo
        run: node scripts/check-graders.mjs
