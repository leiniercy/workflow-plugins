name: Contratos de comportamiento

# Mitad determinista del eval, en dos capas:
#   check-behavior.mjs — contratos de los prompts (read-only de /review, tools/modelo de
#     los agentes, auto-activación de guías, banderas rojas, dato no fiable).
#   check-routing.mjs  — enrutado del catálogo: colisión entre descriptions, fronteras
#     entre guías confundibles y tasa de top-3 sobre su suelo.
# La mitad que necesita un modelo vive en check-activation.mjs (gasta cuota, a mano) y en
# docs/eval-comportamiento.md.

on:
  push:
    branches: ["**"]
    paths:
      - "core/**"
      - "scripts/sync.mjs"
      - "scripts/check-behavior.mjs"
      - "scripts/check-routing.mjs"
      - "adapters/**"
      - ".github/workflows/behavior-check.yml"
  pull_request:
    paths:
      - "core/**"
      - "scripts/sync.mjs"
      - "scripts/check-behavior.mjs"
      - "scripts/check-routing.mjs"
      - "adapters/**"
      - ".github/workflows/behavior-check.yml"

jobs:
  behavior-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Asevera los contratos de comportamiento
        run: node scripts/check-behavior.mjs

      - name: Asevera el enrutado del catálogo de guías
        run: node scripts/check-routing.mjs
