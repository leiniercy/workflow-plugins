name: Hooks — higiene y comportamiento

# Dos invariantes sobre el único código nuestro que se ejecuta solo, en cada sesión y en
# todos los repos del usuario:
#
#   check-hygiene  un hook lee y emite JSON por stdout: no escribe en disco, no toca la
#                  configuración global, y hooks.json solo registra rutas del plugin.
#                  Un plugin que escribe fuera de su raíz no se desinstala solo (medido
#                  con context-mode el 2026-09-11).
#   check-hooks    el hook hace lo que dice: se ejecuta contra repos desechables y se
#                  comprueba el texto que inyecta. Lo que el hook DECIDE (qué comando se
#                  sugiere al arrancar) va en un test, porque un fallo suyo no casca:
#                  miente, y una sesión limpia se fía.
#   check-guard    el guard de acciones irreversibles decide de verdad (deny/ask/nada) al
#                  ejecutarlo con la entrada del harness. Mismo motivo: un guard roto no
#                  casca, deja pasar en silencio lo que existe para frenar.
#   check-post-commit  el aviso de commit sin registrar salta cuando el historial se
#                  queda atrás y calla el resto del tiempo. Los dos lados importan: si no
#                  salta deja el agujero abierto, y si salta de más se deja de leer.

on:
  push:
    branches: ["**"]
    paths:
      - "plugins/backbone/claude/hooks/**"
      - "scripts/check-hygiene.mjs"
      - "scripts/check-hooks.mjs"
      - "scripts/check-guard.mjs"
      - "scripts/check-post-commit.mjs"
      - ".github/workflows/hygiene-check.yml"
  pull_request:
    paths:
      - "plugins/backbone/claude/hooks/**"
      - "scripts/check-hygiene.mjs"
      - "scripts/check-hooks.mjs"
      - "scripts/check-guard.mjs"
      - "scripts/check-post-commit.mjs"
      - ".github/workflows/hygiene-check.yml"

permissions:
  contents: read

jobs:
  hooks-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Higiene de los hooks
        run: node scripts/check-hygiene.mjs

      - name: Comportamiento del hook de SessionStart
        run: node scripts/check-hooks.mjs

      - name: Decisiones del guard de acciones irreversibles
        run: node scripts/check-guard.mjs

      - name: Comportamiento del hook de commit sin registrar
        run: node scripts/check-post-commit.mjs
