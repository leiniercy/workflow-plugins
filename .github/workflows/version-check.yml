name: Coherencia de versión

# Verifica que la versión coincide en los tres sitios donde vive (plugin.json,
# marketplace.json y CHANGELOG). Falla si divergen — el "doctor" de scripts/check-version.mjs.

on:
  push:
    branches: ["**"]
    paths:
      - "plugins/backbone/claude/.claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "CHANGELOG.md"
      - "scripts/check-version.mjs"
      - ".github/workflows/version-check.yml"
  pull_request:
    paths:
      - "plugins/backbone/claude/.claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - "CHANGELOG.md"
      - "scripts/check-version.mjs"
      - ".github/workflows/version-check.yml"

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Comprobar coherencia de versión
        run: node scripts/check-version.mjs
