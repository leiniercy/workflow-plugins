name: Adaptadores en sync con core/

# CI propio de este repo (no reusable). Garantiza que los ficheros generados en
# plugins/ son EXACTAMENTE lo que produce scripts/sync.mjs desde core/. Falla si
# alguien editó un adaptador a mano (drift) o cambió core/ sin regenerar.

on:
  push:
    branches: ["**"]
    paths:
      - "core/**"
      - "scripts/sync.mjs"
      - "scripts/check-sync.mjs"
      - "plugins/**"
      - ".github/workflows/sync-check.yml"
  pull_request:
    paths:
      - "core/**"
      - "scripts/sync.mjs"
      - "scripts/check-sync.mjs"
      - "plugins/**"
      - ".github/workflows/sync-check.yml"

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Regenerar adaptadores desde core/
        run: node scripts/sync.mjs

      - name: Verificar que no hay drift
        run: |
          if [ -n "$(git status --porcelain -- plugins/)" ]; then
            echo "::error::Los adaptadores están desincronizados con core/. Ejecuta 'node scripts/sync.mjs' y commitea los cambios."
            git --no-pager diff -- plugins/
            git status --porcelain -- plugins/
            exit 1
          fi
          echo "✓ Adaptadores en sync con core/."
      - name: Prueba de la generación (huérfanos y ficheros a mano)
        run: node scripts/check-sync.mjs
