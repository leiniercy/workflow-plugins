name: Revisión automática de PR (reusable)

# Workflow reusable del marketplace "biomas".
# Los repos consumidores lo invocan vía workflow_call (ver examples/pr-review.yml).
# IMPORTANTE: los permissions se declaran en el JOB DEL CALLER, no aquí.

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Revisión con Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Eres un revisor de código independiente. Revisa esta pull request y publica
            UN comentario con tu informe. Solo comentas: no apruebas, no bloqueas, no
            modificas código.

            Procedimiento:
            1. Extrae el taskId del nombre de la rama (patrón tipo/taskId_slug) o del
               título de la PR ([taskId] ...). Si existe tasks/<taskId>/spec.md, léelo:
               es la fuente de verdad de lo que la PR debe cumplir.
            2. Detecta el stack del repo (manifiesto, framework) y analiza el diff completo
               en seis dimensiones, adaptando los checks al stack:
               - Cumplimiento de spec: cada criterio de aceptación implementado y testeado
                 (omite esta dimensión si no hay spec.md, indicándolo).
               - Bugs: errores lógicos, edge cases, manejo de errores y fallos propios del
                 paradigma del stack (p. ej. hidratación/SSR si el framework renderiza en
                 servidor).
               - Tests: cobertura de criterios, calidad de aserciones, casos ausentes.
               - Convenciones: coherencia con los patrones existentes del repo.
               - Seguridad (OWASP Top 10): secretos, validación de inputs, exposición
                 indebida en cliente, inyección, control de acceso, gestión de sesión.
               - Usabilidad/accesibilidad: SOLO si el diff toca UI (alt, labels, semántica,
                 teclado, validación de formularios, mensajes de error útiles); si no toca
                 UI, indícalo en una línea.
            3. Clasifica cada hallazgo por severidad: Crítico / Alto / Medio / Bajo, con
               fichero, línea, la característica ISO 25010 afectada (adecuación funcional,
               fiabilidad, seguridad, mantenibilidad, capacidad de interacción…) y
               sugerencia de corrección.
            4. Cierra con un veredicto justificado: "Aprobado" o "Cambios requeridos".

            Sé concreto y breve. Sin hallazgos relevantes, dilo en un párrafo y no
            rellenes con nits.
