name: Escaneo de secretos (gitleaks)

# El .gitignore excluye .env y .mcp.json, pero eso solo protege del descuido de HOY:
# un `git add -f` despistado, o un secreto pegado en un fichero de eval o de test, entra
# al historial y ahí se queda aunque luego se borre del árbol. Este check es la red que
# el .gitignore no da — escanea TODO el historial de commits, no solo el árbol actual.
#
# Se ejecuta el binario de gitleaks con versión fijada, sin action de terceros ni token:
# menos superficie de cadena de suministro que la gitleaks-action, y sin la fricción de
# licencia que esa pide en repos de organización.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks escanea commits: con la profundidad por defecto (1) solo vería el
          # último. 0 = clon completo, necesario para revisar todo el historial.
          fetch-depth: 0

      - name: Escanear secretos en el historial
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          # `git` escanea el historial de commits; --redact no imprime el secreto en el
          # log público de CI; sale con código != 0 si encuentra algo, y eso rompe el job.
          ./gitleaks git . --redact --verbose --exit-code 1
